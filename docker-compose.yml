# Ada-ncoa — run everything with one command:
#
#     docker compose up --build
#
# Then open http://localhost:8080
# Stop with Ctrl+C (or `docker compose down`). Data is kept in Docker volumes.
# Start over with an empty database: `docker compose down -v`
#
# The database password below is a local development default.
# To use your own, create a file named .env next to this file containing:
#     MSSQL_SA_PASSWORD=YourOwn_Strong_Passw0rd

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64          # on Apple-chip Macs, enable Rosetta in Docker Desktop settings
    container_name: damaideparte-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-DaMai_Departe2026!}"
      MSSQL_PID: "Developer"
    ports:
      # 127.0.0.1 only: database tools on the same machine can still connect (e.g. from your Mac
      # when running locally), but the database is never reachable from the internet.
      - "127.0.0.1:1433:1433"
    volumes:
      - damaideparte-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: damaideparte-web
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"   # enables sample data (test users and products)
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=DaMaiDeparte_Dev;User Id=sa;Password=${MSSQL_SA_PASSWORD:-DaMai_Departe2026!};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Database__ApplyMigrationsOnStartup: "true"
      Database__SeedSampleData: "true"
      Security__RequireHttpsCookies: "false"  # the container serves plain http://localhost
    ports:
      # 127.0.0.1 only: on the server, Caddy (HTTPS) proxies to this port from the same machine,
      # so the app is never served over plain HTTP to the internet. Locally, http://localhost:8080 still works.
      - "127.0.0.1:8080:8080"
    volumes:
      - damaideparte-uploads:/app/wwwroot/uploads/donations
    restart: unless-stopped

volumes:
  damaideparte-sql-data:
  damaideparte-uploads:
